name: R reproducibility checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install required R packages
        run: |
          Rscript -e 'install.packages(c("readr", "dplyr", "tidyr", "ggplot2"), repos = "https://cloud.r-project.org")'

      - name: Run Phase 1 and Phase 2 workflow
        run: |
          Rscript R/01_data_import.R
          Rscript R/02_data_quality.R
          Rscript R/03_data_cleaning.R
          Rscript R/04_data_exploration.R
          Rscript R/05_basic_visualization.R
          Rscript R/06_phase2_eda.R
          Rscript R/07_phase2_visualization.R

      - name: Validate data and generated outputs
        run: Rscript R/08_validate_outputs.R
